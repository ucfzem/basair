<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصائر | موسوعة نقد الإلحاد</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .arabic-serif { font-family: 'Amiri', serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased">
    <header class="border-b border-zinc-800 bg-zinc-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                <div>
                    <h1 class="text-base font-bold text-amber-400">بصائر</h1>
                    <p class="text-[10px] text-zinc-400">موسوعة نقد الإلحاد</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-zinc-800 text-zinc-200 text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-amber-500">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="mb-6">
            <input type="text" id="search-input" oninput="filterSections(this.value)" placeholder="ابحث في أقسام وأبواب الموسوعة..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition-colors">
        </div>
        <div id="sections-container" class="space-y-8"></div>
    </main>
    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        <p>جميع الحقوق محفوظة - المنصة الرقمية الهيكلية</p>
    </footer>
    <script src="content-i18n.js"></script>
    <script>
        let currentLang = localStorage.getItem('basair_lang') || 'ar';
        document.getElementById('lang-select').value = currentLang;

        function renderApp() {
            const lang = currentLang;
            const data = siteData[lang];
            document.getElementById('html-root').lang = lang;
            document.getElementById('html-root').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('search-input').placeholder = data.searchPlaceholder;

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            data.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.className = "bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-5";
                
                let chaptersHtml = '';
                sec.chapters.forEach(ch => {
                    chaptersHtml += `
                        <div class="bg-zinc-900 border border-zinc-800/60 rounded-xl p-4 hover:border-amber-500/50 transition-all cursor-pointer group">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-xs font-semibold text-amber-500">${ch.num}</span>
                                <span class="text-[11px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-md">${ch.count}</span>
                            </div>
                            <h3 class="text-base font-bold text-zinc-100 group-hover:text-amber-400 transition-colors">${ch.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1 leading-relaxed">${ch.desc}</p>
                        </div>
                    `;
                });

                secDiv.innerHTML = `
                    <div class="mb-4 border-b border-zinc-800 pb-3">
                        <h2 class="text-lg font-bold text-amber-400">${sec.sectionTitle}</h2>
                        <p class="text-xs text-zinc-400 mt-0.5">${sec.description}</p>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        ${chaptersHtml}
                    </div>
                `;
                container.appendChild(secDiv);
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('basair_lang', lang);
            renderApp();
        }

        function filterSections(query) {
            const lang = currentLang;
            const data = siteData[lang];
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            data.sections.forEach(sec => {
                const filteredChapters = sec.chapters.filter(ch => 
                    ch.title.toLowerCase().includes(query.toLowerCase()) || 
                    ch.desc.toLowerCase().includes(query.toLowerCase()) ||
                    sec.sectionTitle.toLowerCase().includes(query.toLowerCase())
                );

                if (filteredChapters.length > 0) {
                    const secDiv = document.createElement('div');
                    secDiv.className = "bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-5";
                    
                    let chaptersHtml = '';
                    filteredChapters.forEach(ch => {
                        chaptersHtml += `
                            <div class="bg-zinc-900 border border-zinc-800/60 rounded-xl p-4 hover:border-amber-500/50 transition-all cursor-pointer group">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-semibold text-amber-500">${ch.num}</span>
                                    <span class="text-[11px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-md">${ch.count}</span>
                                </div>
                                <h3 class="text-base font-bold text-zinc-100 group-hover:text-amber-400 transition-colors">${ch.title}</h3>
                                <p class="text-xs text-zinc-400 mt-1 leading-relaxed">${ch.desc}</p>
                            </div>
                        `;
                    });

                    secDiv.innerHTML = `
                        <div class="mb-4 border-b border-zinc-800 pb-3">
                            <h2 class="text-lg font-bold text-amber-400">${sec.sectionTitle}</h2>
                            <p class="text-xs text-zinc-400 mt-0.5">${sec.description}</p>
                        </div>
                        <div class="grid gap-3 sm:grid-cols-2">
                            ${chaptersHtml}
                        </div>
                    `;
                    container.appendChild(secDiv);
                }
            });
        }

        renderApp();
    </script>
</body>
</html>
